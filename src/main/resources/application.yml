spring:
  application:
    name: consentflow-api
  datasource:
    url: jdbc:postgresql://localhost:15435/consentflow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

